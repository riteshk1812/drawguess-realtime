# Optional local infrastructure. The game runs with `npm run dev` without these services.
# Redis: restart snapshots, rate-limit counters, and the Socket.IO adapter.
# Postgres: durable completed-game history.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drawguess
      POSTGRES_PASSWORD: drawguess
      POSTGRES_DB: drawguess
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawguess -d drawguess"]
      interval: 5s
      timeout: 3s
      retries: 10
